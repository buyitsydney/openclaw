name: CI Dev (Fork Only)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.sha }}
  cancel-in-progress: true

jobs:
  guard-fork-only:
    name: Guard fork-only execution
    if: github.repository != 'openclaw/openclaw'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm fork context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Running dev CI in fork context."

  check:
    name: check
    needs: [guard-fork-only]
    if: github.repository != 'openclaw/openclaw'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Check types and lint and oxfmt
        run: pnpm check

  build:
    name: build
    needs: [check]
    if: github.repository != 'openclaw/openclaw'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build dist
        run: pnpm build

  test:
    name: test
    needs: [build]
    if: github.repository != 'openclaw/openclaw'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run test suite
        run: pnpm test

  test-e2e:
    name: test-e2e
    needs: [test]
    if: github.repository != 'openclaw/openclaw'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run e2e tests
        run: pnpm test:e2e
