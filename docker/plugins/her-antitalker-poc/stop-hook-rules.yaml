# Stop-Hook Pipeline Rules — all rules are data, no source changes needed.
#
# 路径: 容器内 /data/.openclaw/workspace/.antitalker/stop-hook-rules.yaml
#       host   /home/cltx/.openclaw/workspace/.antitalker/stop-hook-rules.yaml
#
# 热加载: 修改此文件后 ~2 秒内自动重注册所有规则 (mtime polling)。
#
# 规则执行: 按 priority 从高到低依次评估,第一条"命中"(返回 shouldContinue=true)
# 就终止,续命消息进入 loop user role。
#
# 评估顺序 (单 rule):
#   1. 所有 preconditions 必须通过 (AND)  — 任一失败则跳过此 rule
#   2. fire_when 里多个 clause 必须同时满足 (AND)  — 要 OR 就拆两条 rule
#   3. fire 时返回 message 给 loop
#
# 注: "最后一句给用户的话" 来源 = assistant.text block + outbound message tool args
# (by BMW hook 统一 capture 到 lastAssistantText)。
#
# 死循环保护: pipeline 级别 max_continuation_turns (默认 3) — 单 session 连续
# 强制续命 N 轮后放行一次,重置。

enabled: true
max_continuation_turns: 3

# Observable sources: 声明"assistant 发给用户的话"到底从哪里读。
# Pipeline 用这个把 message tool 的 args.text 累计到"本 turn assistant 输出"里。
# 加新 channel tool 时,只改这里,不改代码。
observable_sources:
  outbound_message_tools:
    - message
    - message_send
    - send
    - send_message
    - feishu_send
    - feishu_send_message
    - feishu_send_card
    - feishu_send_text
  outbound_message_text_fields:
    - text
    - message
    - content
    - body

rules:
  # ─── Rule 1 · prose-only-ending (priority 30 · 最高) ───────────────────
  # 核心设计: 只看最后一句给用户的话。光说不练 = 有承诺/延后词但没真干 → 拦截。
  # 不管 Her 本 turn 调了几次 tool,只要最后发给用户的话里出现
  # "我来/让我/接下来/30 分钟后/稍后回来/I'll" 等承诺语 → 强制续命。
  #
  # 为什么不看 tool: Her 可能 exec 了 18 次后,最后一句 message send 发
  # "30min 后回来给你报告" → end_turn 睡死。这时候看 toolcount 是抓不到的,
  # 必须只看"最后一句话"。
  - id: prose-only-ending
    enabled: true
    priority: 30
    preconditions:
      min_assistant_text_length: 10   # 至少 10 字,排除"好的"、"收到"、"OK"、NO_REPLY
      min_user_message_length: 10     # 闲聊短消息不评估
      assistant_text_skip_if_matches_any:
        - '^HEARTBEAT_OK'
        - '^NO_REPLY'
    fire_when:
      text_matches_any:
        # 中文:承诺要做但未做
        - '我(?:来|去|先|现在|马上|立刻)'
        - '让我'
        - '我(?:会|将|要|得)'
        - '接下来'
        - '下一步'
        # 中文:延后/稍后回来 (最常见的装死前言)
        - '稍后'
        - '待会|等会|一会|回头'
        - '\d+\s*(?:min|分钟|小时|hour|h)\s*(?:后|之后|later)'
        - '(?:明天|下午|晚点|晚上).*(?:再|之后|回来|汇报|告诉)'
        - '(?:汇报|报告|告诉|跟你).*(?:你|结果)'
        - '回来(?:给你|向你|跟你).*(?:报告|汇报|说|讲)'
        # 英文:承诺/延后
        - "\\bI'?ll\\b"
        - '\\bLet me\\b'
        - '\\bI (?:will|shall|should|can|need to)\\b'
        - '\\bNext,?\\s*I\\b'
        - '\\bNow (?:I|let)\\b'
        - '\\bI.?ll\\s+(?:come back|report back|update you|check back)'
        - '\\b(?:in|after)\\s+\\d+\\s*(?:min|minute|hour|hr)s?\\b'
    max_retries: 2
    message: |
      ⚠️ antitalker prose-only-ending: 光说不练!

      你最后一句话里有承诺/延后词(比如"我来 X/接下来/30 分钟后回来")但就此 end_turn。
      这是典型的光说不练,会导致睡死。

      禁止:
      - 说"我来 X"然后 end_turn — 现在就调 tool 做 X
      - 说"X 分钟后回来/稍后汇报" — 现在就继续干,别躲
      - 说"接下来/下一步" 后停止 — 直接把下一步做了

      允许:
      - 说"已完成 X" 并 end_turn — 这是正确收尾
      - 说"需要你确认 Y 再继续" 用 message send 反问 — 合法终态
      - 说 NO_REPLY / HEARTBEAT_OK — 系统终态,不受此规则限制

  # ─── Rule 2 · no-toolcall-guard (priority 20) ─────────────────────────
  # 用户布置任务(消息够长),Her 本 turn 没调任何实质性 tool → 续命。
  # 这是 prose-only 的兜底:即使用户消息里没有承诺词,只要她没真干活就拦。
  - id: no-toolcall-guard
    enabled: true
    priority: 20
    preconditions:
      min_user_message_length: 10
      assistant_text_skip_if_matches_any:
        - '^HEARTBEAT_OK'
        - '^NO_REPLY'
    fire_when:
      no_substantial_tool: true
    substantial_tools:
      - exec
      - read
      - write
      - edit
      - feishu_doc
      - feishu_sheet
      - feishu_bitable
    max_retries: 1
    message: |
      ⚠️ antitalker no-toolcall-guard: 没调 substantial tool

      用户让你干活,但你本 turn 没调任何实质性 tool (exec/read/write/edit/feishu_*)。
      禁止只说不干。立刻选择:
      - 有具体动作 → 调 exec/read/write/edit
      - 信息不够 → 用 message send 精确反问一句就停
      - 只需文字答复 → 用 message send 发出 (message send 不算 substantial,但属合法终态)
