<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>CarHer</title>
    <style>
      :root {
        --bg-dark: #faf9f6;
        --bg-card: #ffffff;
        --accent: #007aff;
        --accent-glow: rgba(0, 122, 255, 0.2);
        --text: #1c1c1e;
        --text-dim: #8e8e93;
        --user-color: #34c759;
        --her-color: #5856d6;
        --system-color: #8e8e93;
        --danger: #ff3b30;
        --success: #34c759;
        --toolbar-bg: rgba(250, 249, 246, 0.88);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg-dark);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        /* safe area for notch devices */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* === Transcript area === */
      .transcript {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        -webkit-overflow-scrolling: touch;
      }

      .transcript .msg {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.5;
        animation: fadeIn 0.2s ease;
      }

      .msg .tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 4px;
        vertical-align: middle;
      }

      .msg.user .tag { background: var(--user-color); color: #fff; }
      .msg.assistant .tag { background: var(--her-color); color: #fff; }
      .msg.system .tag { background: #e5e5ea; color: #636366; }
      .msg.user { color: #1c7a34; }
      .msg.assistant { color: var(--text); }
      .msg.system { color: var(--text-dim); font-size: 12px; }

      /* === Center button area === */
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
        flex-shrink: 0;
      }

      .main-btn {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        transition: transform 0.2s, box-shadow 0.3s;
        -webkit-tap-highlight-color: transparent;
      }

      .main-btn:active { transform: scale(0.95); }

      .main-btn.idle {
        box-shadow: 0 0 0 0 var(--accent-glow);
        animation: pulse 2s ease-in-out infinite;
      }

      .main-btn.connecting {
        background: var(--text-dim);
        animation: none;
        cursor: not-allowed;
      }

      .main-btn.live {
        background: var(--danger);
        box-shadow: 0 0 20px rgba(255, 59, 48, 0.3);
        animation: liveGlow 1.5s ease-in-out infinite;
      }

      .main-btn.error {
        background: #333;
        animation: none;
      }

      .subtitle {
        margin-top: 10px;
        font-size: 13px;
        color: var(--text-dim);
      }

      /* === Video preview (shown when camera/screen active) === */
      .video-container {
        display: none;
        padding: 0 16px 8px;
        flex-shrink: 0;
      }

      .video-container.active { display: block; }

      .video-container video {
        width: 100%;
        max-height: 200px;
        border-radius: 8px;
        background: #000;
        object-fit: contain;
      }

      /* === Bottom toolbar === */
      .toolbar {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 8px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(0,0,0,0.08);
        flex-shrink: 0;
      }

      .tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 10px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        padding: 4px 8px;
        border-radius: 8px;
        transition: color 0.2s, background 0.2s;
      }

      .tool-btn .icon { font-size: 22px; margin-bottom: 2px; }
      .tool-btn.active { color: var(--accent); }
      .tool-btn.active.danger { color: var(--danger); }
      .tool-btn:active { background: rgba(0,0,0,0.05); }

      /* === Debug overlay === */
      .debug-overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 80px; /* above toolbar */
        background: rgba(250, 249, 246, 0.97);
        padding: 16px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        z-index: 10;
      }

      .debug-overlay.visible { display: block; }

      .debug-overlay h3 {
        font-size: 14px;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .debug-overlay pre {
        font-family: "SF Mono", "Menlo", monospace;
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-dim);
        white-space: pre-wrap;
        word-break: break-all;
      }

      .debug-overlay .status-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 12px;
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }

      .debug-overlay .status-label { color: var(--text-dim); }
      .debug-overlay .status-value { color: var(--text); font-weight: 500; }
      .debug-overlay .status-value.ok { color: var(--success); }
      .debug-overlay .status-value.err { color: var(--danger); }

      /* === Volume popup === */
      .volume-popup {
        display: none;
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-card);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 12px;
        padding: 12px 20px;
        z-index: 5;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      }

      .volume-popup.visible { display: flex; }

      .volume-popup input[type="range"] {
        width: 140px;
        accent-color: var(--accent);
      }

      .volume-popup .vol-label {
        font-size: 12px;
        color: var(--text-dim);
        min-width: 32px;
        text-align: right;
      }

      /* === Animations === */
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
        50% { box-shadow: 0 0 0 20px transparent; }
      }

      @keyframes liveGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(255, 59, 48, 0.2); }
        50% { box-shadow: 0 0 30px rgba(255, 59, 48, 0.4); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Transcript -->
      <div class="transcript" id="transcript">
        <div class="msg system"><span class="tag">SYS</span>点击下方按钮开始对话</div>
      </div>

      <!-- Video preview -->
      <div class="video-container" id="videoContainer">
        <video id="videoPreview" autoplay playsinline muted></video>
      </div>

      <!-- Center button -->
      <div class="center">
        <button class="main-btn idle" id="mainBtn">开始</button>
        <div class="subtitle">CarHer 车载 AI 助手</div>
      </div>

      <!-- Bottom toolbar -->
      <div class="toolbar">
        <button class="tool-btn" id="micBtn" title="麦克风">
          <span class="icon">🎤</span>
          <span>音频</span>
        </button>
        <button class="tool-btn" id="camBtn" title="摄像头">
          <span class="icon">📹</span>
          <span>视频</span>
        </button>
        <button class="tool-btn" id="screenBtn" title="屏幕共享">
          <span class="icon">🖥️</span>
          <span>屏幕</span>
        </button>
        <button class="tool-btn" id="volBtn" title="音量">
          <span class="icon">🔊</span>
          <span>音量</span>
        </button>
        <button class="tool-btn" id="debugBtn" title="调试">
          <span class="icon">🐛</span>
          <span>调试</span>
        </button>
      </div>

      <!-- Volume popup -->
      <div class="volume-popup" id="volumePopup">
        <input type="range" id="volume" min="0" max="100" value="80" />
        <span class="vol-label" id="volLabel">80%</span>
      </div>

      <!-- Debug overlay -->
      <div class="debug-overlay" id="debugOverlay">
        <h3>版本</h3>
        <div class="status-row">
          <span class="status-label">前端版本</span>
          <span class="status-value" id="dbgVersion">加载中...</span>
        </div>
        <h3 style="margin-top: 12px">环境检测</h3>
        <div id="envChecks"></div>
        <h3 style="margin-top: 12px">连接状态</h3>
        <div class="status-row">
          <span class="status-label">OpenClaw</span>
          <span class="status-value" id="dbgOcStatus">未连接</span>
        </div>
        <div class="status-row">
          <span class="status-label">Gemini</span>
          <span class="status-value" id="dbgGeminiStatus">未连接</span>
        </div>
        <div class="status-row">
          <span class="status-label">麦克风</span>
          <span class="status-value" id="dbgMicStatus">关闭</span>
        </div>
        <h3 style="margin-top: 12px">Jitter Buffer</h3>
        <div class="status-row" style="align-items: center">
          <span class="status-label">缓冲 (ms)</span>
          <span style="display: flex; align-items: center; gap: 8px">
            <input type="range" id="jitterSlider" min="0" max="1000" step="50" value="0"
              style="width: 120px; accent-color: var(--accent)" />
            <span id="jitterLabel" style="font-size: 12px; font-weight: 600; min-width: 40px; text-align: right">0</span>
          </span>
        </div>
        <h3 style="margin-top: 12px">Audio Latency</h3>
        <pre id="dbgAudioObs" style="overflow-y: auto">等待数据...</pre>
      </div>
    </div>

    <!-- Load shared libraries (unchanged) -->
    <script src="remote-setup.js"></script>
    <script src="geminilive.js"></script>
    <script src="mediaUtils.js"></script>
    <script src="tools.js"></script>
    <script src="car-control.js"></script>
    <script src="inject-delivery.js"></script>
    <!-- Mobile-specific logic -->
    <script src="mobile-script.js"></script>
  </body>
</html>
